<div style="font-family:system-ui,Arial,sans-serif;max-width:560px;margin:auto;color:#1d2321">
  <h2>Bitte bestätige deinen Suchauftrag</h2>
  <p>Du suchst: <b>{{ type_label }}</b> in <b>{{ data.location }}</b> (+{{ data.radius_km|int }} km)
     mit mindestens <b>{{ data.min_cashflow|eur }}</b> Überschuss pro Monat.</p>
  <p><a href="{{ confirm_url }}" style="display:inline-block;background:#0f7a5c;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:600">Suchauftrag bestätigen</a></p>
  <p style="color:#5d6662;font-size:13px">Wenn du das nicht warst, ignoriere diese Mail einfach.</p>
</div>
